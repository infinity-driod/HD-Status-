<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Compressor</title>
<style>
:root{--bg:#0e1512;--panel:#16201b;--text:#e8efe9;--muted:#8fa196;--accent:#25d366;--err:#ff7a7a}
@media (prefers-color-scheme:light){:root{--bg:#f1f5f2;--panel:#fff;--text:#14201a;--muted:#5d6f64;--err:#c62828}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:start center;padding:20px}
main{width:100%;max-width:440px;background:var(--panel);border-radius:14px;padding:24px}
h1{font-size:1.4rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 14px}
input,select,button,.go{display:block;width:100%;font:inherit;border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--muted);background:transparent;color:var(--text)}
select option{color:#000}
.check{display:flex;gap:10px;align-items:center;margin-top:12px}
.check input{width:auto;margin:0}
button,.go{background:var(--accent);border:0;color:#04140a;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
progress{width:100%;margin-top:14px}
#msg{margin:14px 0 4px;white-space:pre-line}
.err{color:var(--err)}
.part{margin-top:18px;border-top:1px solid var(--muted);padding-top:12px}
video{width:100%;max-height:340px;border-radius:10px;background:#000}
</style>
</head>
<body>
<main>
  <h1>Status Compressor</h1>
  <p>Shrinks a video so WhatsApp leaves it nearly untouched, and cuts long clips into 30-second parts. It all runs on your phone. Nothing is uploaded.</p>
  <input id="file" type="file" accept="video/*" aria-label="Video">
  <select id="q" aria-label="Quality">
    <option value="1280:23:2500">Balanced (recommended)</option>
    <option value="1920:20:5000">Sharper, bigger file</option>
    <option value="960:27:1200">Smaller file</option>
  </select>
  <label class="check"><input id="split" type="checkbox" checked> Split into 30-second parts</label>
  <button id="go">Compress for Status</button>
  <progress id="bar" max="1" value="0" hidden></progress>
  <div id="msg" role="status"></div>
  <div id="out"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
const $ = id => document.getElementById(id);
const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
const CDN = 'https://cdn.jsdelivr.net/npm/';
// The worker and core must be same-origin, so fetch them and serve them as blob URLs.
const blobURL = async (u, type) => URL.createObjectURL(new Blob([await (await fetch(u)).arrayBuffer()], { type }));
let ff, logs = [];

async function load() {
  if (ff) return ff;
  say('Loading the converter (about 30 MB, first time only)...');
  const f = new FFmpegWASM.FFmpeg();
  f.on('log', ({ message }) => { logs = [...logs, message].slice(-6); });
  await f.load({
    classWorkerURL: await blobURL(CDN + '@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', 'text/javascript'),
    coreURL: await blobURL(CDN + '@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js', 'text/javascript'),
    wasmURL: await blobURL(CDN + '@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm', 'application/wasm'),
  });
  return (ff = f);
}

const duration = file => new Promise((res, rej) => {
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = () => { res(v.duration); URL.revokeObjectURL(v.src); };
  v.onerror = () => rej(new Error('Could not read this video.'));
  v.src = URL.createObjectURL(file);
});

function addPart(blob, name) {
  const url = URL.createObjectURL(blob);
  const d = document.createElement('div');
  d.className = 'part';
  d.innerHTML = `<video src="${url}" controls playsinline></video><p>${name}, ${(blob.size / 1048576).toFixed(1)} MB</p>`;
  const save = document.createElement('a');
  save.className = 'go'; save.href = url; save.download = name; save.textContent = 'Save to phone';
  d.append(save);
  const file = new File([blob], name, { type: 'video/mp4' });
  if (navigator.canShare?.({ files: [file] })) {
    const b = document.createElement('button');
    b.textContent = 'Share to WhatsApp';
    b.onclick = () => navigator.share({ files: [file] }).catch(() => {});
    d.append(b);
  }
  $('out').append(d);
}

$('go').onclick = async () => {
  const file = $('file').files[0];
  if (!file) return say('Choose a video first.', true);
  if (file.size > 400 * 1048576) return say('This file is too big to convert in the browser (limit about 400 MB).', true);
  $('go').disabled = true; $('out').innerHTML = ''; $('bar').hidden = false; $('bar').value = 0;
  let lock;
  try { lock = await navigator.wakeLock?.request('screen'); } catch {}
  try {
    const [side, crf, kbps] = $('q').value.split(':');
    const split = $('split').checked;
    const dur = await duration(file);
    const count = split ? Math.max(1, Math.ceil((dur - 0.5) / 30)) : 1;
    const f = await load();
    await f.writeFile('in', new Uint8Array(await file.arrayBuffer()));
    const vf = `scale=min(${side}\\,iw):min(${side}\\,ih):force_original_aspect_ratio=decrease:force_divisible_by=2`;
    for (let i = 0; i < count; i++) {
      const name = `status-${i + 1}.mp4`;
      const onProg = ({ progress }) => { $('bar').value = Math.min(1, Math.max(0, progress)); };
      f.on('progress', onProg);
      say(`Compressing part ${i + 1} of ${count}. Keep this tab open.`);
      const code = await f.exec([
        '-ss', String(i * 30), '-i', 'in', ...(split ? ['-t', '30'] : []),
        '-vf', vf, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', crf,
        '-maxrate', `${kbps}k`, '-bufsize', `${kbps * 2}k`, '-pix_fmt', 'yuv420p',
        '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', name,
      ]);
      f.off('progress', onProg);
      if (code !== 0) throw new Error('Conversion failed.\n' + logs.join(' ').slice(-200));
      const data = await f.readFile(name);
      await f.deleteFile(name);
      addPart(new Blob([data], { type: 'video/mp4' }), name);
    }
    say(`Done. ${count} part${count > 1 ? 's' : ''} ready. Share each one to WhatsApp, then pick My status.`);
  } catch (e) {
    say(e.message || String(e), true);
  } finally {
    $('go').disabled = false; $('bar').hidden = true; lock?.release?.();
  }
};
</script>
</body>
</html>
